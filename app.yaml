command: ["streamlit", "run", "app.py", "--server.port", "8000", "--server.address", "0.0.0.0"]

env:
  - name: PYTHONUNBUFFERED
    value: "1"
  # PGHOST / PGPORT / PGDATABASE / PGUSER / PGSSLMODE / PGAPPNAME are injected
  # automatically by the attached 'postgres' resource. Do not set them here.
  #
  # PGENDPOINT is NOT injected. It is the resource name of the compute endpoint and is
  # required by generate_database_credential().
  - name: PGENDPOINT
    valueFrom: postgres
  - name: PGSCHEMA
    value: "capstone"