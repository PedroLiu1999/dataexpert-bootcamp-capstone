# Databricks Asset Bundle Configuration for Capstone Academic Research & Study Plan Assistant

bundle:
  name: capstone-app

artifacts:
  capstone_wheel:
    type: whl
    build: uv build --wheel
    path: .

resources:
  postgres_projects:
    capstone_lakebase_project:
      project_id: 'capstone-lakebase-new'
      display_name: 'Capstone Research Lakebase'
      pg_version: 17

  postgres_branches:
    dev_branch:
      parent: ${resources.postgres_projects.capstone_lakebase_project.id}
      branch_id: 'dev'
      no_expiry: true

  postgres_endpoints:
    dev_endpoint:
      parent: ${resources.postgres_branches.dev_branch.id}
      endpoint_id: 'primary'
      endpoint_type: 'ENDPOINT_TYPE_READ_WRITE'
      autoscaling_limit_min_cu: 0.5
      autoscaling_limit_max_cu: 1
      replace_existing: true

  apps:
    capstone_app:
      name: capstone-research-app
      source_code_path: .
      resources:
        - name: postgres
          postgres:
            branch: ${resources.postgres_branches.dev_branch.id}
            database: ${resources.postgres_branches.dev_branch.id}/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE

  jobs:
    paper_spark_ingestion_job:
      name: capstone-spark-paper-ingestion
      schedule:
        quartz_cron_expression: "0 0 */2 * * ?"
        timezone_id: "UTC"
      tasks:
        - task_key: run_spark_paper_ingestion
          notebook_task:
            notebook_path: ./notebooks/spark_ingestion_pipeline.ipynb
            base_parameters:
              search_query: "Graph Neural Networks for Drug Discovery"
              limit: "25"
              user_id: "scheduled-job"
              pg_endpoint: ${resources.postgres_endpoints.dev_endpoint.id}
              pg_database: "databricks_postgres"
              pg_schema: "capstone"
              bundle_root: ${workspace.root_path}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ./dist/*.whl

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
