[project]
name = "capstone"
version = "0.1.0"
description = "Capstone Academic Research & Study Plan Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.89.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.13.4",
    "pyspark>=3.5.0",
    "requests>=2.34.2",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.61.1",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "testcontainers[postgres]",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests against PostgreSQL database",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "F401", "F841", "F811"] # Baseline configuration; tightened in T15





