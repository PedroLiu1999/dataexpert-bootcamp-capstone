[project]
name = "capstone"
version = "0.1.0"
description = "Capstone Academic Research & Study Plan Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.89.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.61.1",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
spark = ["pyspark>=3.5.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "testcontainers[postgres]",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests against PostgreSQL database",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["F821", "W291", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"









